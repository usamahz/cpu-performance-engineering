name: MCP release

on:
  push:
    tags:
      - "mcp-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('misc/mcp/pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME#mcp-v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in misc/mcp/pyproject.toml"
            exit 1
          fi
      - name: Build the sdist and wheel
        run: |
          python -m pip install build
          CPU_PERF_COMMIT=$GITHUB_SHA python -m build misc/mcp --outdir dist
      - name: Test the wheel outside the repository
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl pytest
          /tmp/smoke/bin/cpu-perf --selftest
          cp -r misc/mcp/tests /tmp/wheel-tests
          cd /tmp && /tmp/smoke/bin/python -m pytest wheel-tests -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cpu-perf
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    name: List in the MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # the registry signs in with this workflow's GitHub identity; no secret
    steps:
      - uses: actions/checkout@v4
      - name: server.json names the tagged version
        run: |
          version="${GITHUB_REF_NAME#mcp-v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          jq -e --arg v "$version" '.version == $v and (.packages | all(.version == $v))' misc/mcp/server.json
      - name: Wait for the release on PyPI, with its mcp-name line
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/cpu-perf/$VERSION/json" -o pypi.json && break
            sleep 10
          done
          jq -e '.info.description | contains("mcp-name: io.github.usamahz/cpu-perf")' pypi.json
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version
      - name: Validate, sign in and publish
        run: |
          ./mcp-publisher validate misc/mcp/server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish misc/mcp/server.json
