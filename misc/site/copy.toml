[[learn.questions]]
title = "How do I profile CPU performance on Linux?"
text = "Start with perf stat for event counts. Check that cycles are available on the machine, then use perf record to sample and perf annotate to inspect hot instructions. The profiling chapter links to the perf maintainers’ walkthrough."
read = "Linux perf profiling and flame graphs"
href = "/learn/measurement/#cpu-profilers-and-flame-graphs"
benchmark = "05-measurement-pitfalls"

[[learn.questions]]
title = "How do I measure CPU cache and TLB latency?"
text = "Use a pointer chase so each load depends on the previous one. Sweep the working-set size and compare random visits to cache lines with random visits across pages."
read = "Caches, TLBs and page walks"
href = "/learn/memory-hierarchy/#tlbs-page-walks-and-prefetchers"
benchmark = "04-cache-latency"

[[learn.questions]]
title = "Why did the compiler skip vectorising a loop?"
text = "Check the vectoriser’s remarks and read the emitted assembly. The aliasing benchmark compares the same loop with and without restrict, which lets the compiler assume its pointers do not alias in that access pattern."
read = "Target flags and auto-vectorisation"
href = "/learn/compilers-and-codegen/#target-flags-and-auto-vectorisation"
benchmark = "08-autovectorization-aliasing"

[[learn.questions]]
title = "How can a load test understate tail latency?"
text = "A closed-loop client waits for each response before issuing another request. When the server stalls, the client sends fewer requests, so the latency distribution omits some of the waiting that a fixed arrival schedule would expose."
read = "Tail latency measurement"
href = "/learn/tail-latency-and-production-systems/#measuring-the-tail"
benchmark = "12-coordinated-omission"

# Chapter titles and summaries describe the existing README sections. The
# README headings still define the public URLs and anchors.
[chapter_search.start-here]
title = "How to Learn CPU Performance Engineering"
description = "Start with ten readings on CPU pipelines, caches, memory barriers, profiling and performance models. Apply them with a cache-latency benchmark."
[chapter_search.one-instruction-end-to-end]
title = "How a CPU Executes an Instruction"
description = "Follow an instruction through fetch, decode, register rename, issue, execution and retirement. Reproduce the cost of branch misprediction."
[chapter_search.microarchitecture]
title = "CPU Microarchitecture, Branch Prediction and SMT"
description = "Read original work on instruction-level parallelism, SMT, branch predictors and CPU instruction latency and throughput."
[chapter_search.memory-hierarchy]
title = "CPU Memory Hierarchy, Caches and TLBs"
description = "Primary sources on CPU cache misses, TLBs, page walks, prefetching and memory ordering, with a pointer-chasing benchmark."
[chapter_search.measurement]
title = "CPU Profiling with Linux perf and Hardware Counters"
description = "Find primary sources for Linux perf, PMU events, sampling, flame graphs and microbenchmark pitfalls."
[chapter_search.models]
title = "CPU Performance Models: Roofline and Top-Down Analysis"
description = "Use Roofline, execution-cache-memory, top-down analysis, scaling laws and queueing to reason about CPU bottlenecks."
[chapter_search.single-thread-optimisation]
title = "Single-Thread CPU Optimisation and SIMD"
description = "Primary sources on data layout, loop transforms, SIMD and branchless code, with an array-of-structs versus structure-of-arrays benchmark."
[chapter_search.compilers-and-codegen]
title = "Compiler Optimisation, Code Generation and Vectorisation"
description = "Read emitted assembly and trace compiler decisions about target flags, auto-vectorisation, inlining, link-time and profile-guided optimisation."
[chapter_search.concurrency]
title = "CPU Concurrency, Atomics and False Sharing"
description = "Read primary sources on memory models, atomics, locks, allocators and work stealing. Measure the cost of false sharing with a C benchmark."
[chapter_search.numa-and-multi-socket]
title = "NUMA Performance and Linux Memory Placement"
description = "Study first-touch placement, NUMA policies, topology and page migration, with a benchmark that separates allocation from first touch."
[chapter_search.os-and-io]
title = "CPU Costs of Syscalls, Scheduling and I/O"
description = "Explore Linux syscalls, asynchronous I/O, CPU affinity, interrupts, kernel bypass and resource partitioning. Reproduce the cost of a syscall."
[chapter_search.tail-latency-and-production-systems]
title = "Tail Latency and Coordinated Omission"
description = "Primary sources on latency percentiles, jitter and load generation, with a benchmark comparing closed-loop and open-loop measurement."
[chapter_search.inference-on-cpu]
title = "CPU Inference Performance, GEMM and Quantization"
description = "Study CPU inference through BLAS, inference runtimes, quantization, matrix instructions and threading. Compare SGEMM implementations in C."
[chapter_search.hardware-generations]
title = "Server CPU Architecture: Xeon, EPYC and Arm Neoverse"
description = "Compare primary sources on Intel Xeon, AMD EPYC and Arm Neoverse. Measure the same code on performance and efficiency cores."
[chapter_search.benchmarks]
title = "CPU Benchmark Suites: SPEC CPU, STREAM and More"
description = "Find CPU benchmark suites, official run rules and methodology for interpreting scores. Reproduce memory bandwidth measurements in C."
[chapter_search.watchlist]
title = "Server CPU and ISA Watchlist"
description = "Track CPU and ISA developments awaiting a specification, shipping hardware or a published, reproducible measurement."

